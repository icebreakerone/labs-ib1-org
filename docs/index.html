<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB1 Labs</title>
<meta name="keywords" content="IB1 experiment labs icebreaker one">

">

">

<meta name="twitter:card" content="summary">

">
<link rel="icon" href="img/cropped-00-IB1-Roundel-Yellow-X-Small-128px-rgb-32x32.png" sizes="32x32">
<link rel="icon" href="img/cropped-00-IB1-Roundel-Yellow-X-Small-128px-rgb-192x192.png" sizes="192x192">
<style>
:root { 
--ink: #ffffff;
--black: #0D1C22;
--dark: #1A3844;
--muted: #C8D4DE;
--g4: #5A7084;
--g3: #91A9BD;
--g2: #C8D4DE;
--g1: #ECF0F1;
--orange: #FF4D11;
--yellow: #FFEC00; 
--t-red: #E53935;
--t-blue: #1565C0;
--t-teal: #0097A7;
--t-yellow: #FFEA00;
--t-pink: #F06292;
--t-sky: #1F97F3;
--t-green: #4CAF50;
--t-amber: #FFC107;
--t-purple: #9C27B0;
--t-cyan-lt: #50C3F7;
--t-lime-lt: #8BC34A;
--t-orange: #FB8C00;
--t-violet: #7E57C3;
--t-cyan: #00BCD4;
--lime: #CDDC39;
--t-grey: #BDBDBD;
--t-sand: #DFD5C6;
--t-gold: #BF9B68;
--t-brown: #795548; 
--max-w: 1160px;
--gutter: 40px; 
--font: 'Open Sans', sans-serif; 
--sp-xs: 4px;
--sp-sm: 8px;
--sp-md: 16px;
--sp-lg: 24px;
--sp-xl: 36px;
--sp-2xl: 48px;
--sp-3xl: 64px;
--line: #E53935;
}
@media (max-width: 767px) {
:root {
--gutter: 20px;
}
}
 
 * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--dark);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px clamp(20px, 6vw, 64px);
  }

  header a {
    color: var(--white);
    text-decoration: none;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 40px clamp(20px, 6vw, 64px);
  }

  .content {
    display: flex;
    align-items: center;
    gap: clamp(32px, 6vw, 72px);
    width: 100%;
  }

  .hero {
    max-width: 640px;
    flex: 1 1 420px;
  }

  .hero-image {
    flex: 1 1 320px;
    aspect-ratio: 4 / 3;
    max-width: 420px;
    border-radius: 12px;
    background-image: url(img/green-chemistry-white.png);
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 760px) {
    .content {
      flex-direction: column;
      align-items: stretch;
    }
    .hero-image {
      max-width: none;
      order: -1;
    }
  }

  .hero .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    margin-bottom: 28px;
  }

  .tag .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--yellow);
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

 .roundel {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 clamp(20px, 6vw, 64px);
  }

  .hero {
    max-width: 640px;
  }

  .hero .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--g2);
    border: 1px solid var(--orange);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    margin-bottom: 28px;
  }

  .tag .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--yellow);
  }

  h1 {
    font-size: clamp(34px, 5.5vw, 56px);
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
    font-weight: 700;
    color: var(--yellow);
  }

  p.lede {
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 32px;
    max-width: 46ch;
  }

  footer {
    padding: 24px clamp(20px, 6vw, 64px) 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }

  footer a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    border-bottom: 1px solid var(--yellow);
    padding-bottom: 1px;
  }

  footer a:hover {
    color: var(--muted);
  }

  @media (max-width: 480px) {
    footer { flex-direction: column; gap: 10px; align-items: flex-start; }
  }
</style>
</head>
<body>

  <header>
    <a href="https://labs.ib1.org/">
    <div class="mark">
      <span class="roundel" aria-hidden="true">
          <img src="img/ib1-roundel.png" alt="IB1 Labs" class="roundel" width="30" height="30">
      </span>
      IB1 Labs
    </div>
    </a>
    <span class="eyebrow">Experimental</span>
  </header>

  <main>
    <div class="content">
      <div class="hero-image" role="img" aria-label="Green chemistry icons created by Fazrian Zahrawani - Flaticon>"></div>
      <div class="hero">
        <h1>Ideas from Icebreaker&nbsp;One</h1>
        <p class="lede">
          This is where IB1 tries things out: prototypes, demos, and
          experimental content that aren't quite ready for the main site.
          Expect things to change, break, or disappear without notice.
        </p>
      </div>
    </div>
  </main>

  <footer>
    <span>&copy; Icebreaker One Limited</span>
    <a href="https://ib1.org">ib1.org &rarr;</a>
  </footer>

</body>
</html>
